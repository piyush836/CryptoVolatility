<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Volatility Forecaster - Multi-Coin Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: slideDown 0.6s ease-out;
        }

        header h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.95;
            font-weight: 300;
        }

        .control-panel {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            animation: fadeUp 0.8s ease-out;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95em;
        }

        .coin-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .coin-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid #e0e0e0;
        }

        .coin-checkbox:hover {
            border-color: #667eea;
            background: #f9f9ff;
        }

        .coin-checkbox input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .coin-checkbox input:checked + span {
            color: #667eea;
            font-weight: 600;
        }

        .horizon-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .horizon-btn {
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .horizon-btn:hover {
            border-color: #667eea;
            background: #f9f9ff;
        }

        .horizon-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            flex: 1;
            min-width: 150px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            animation: fadeUp 0.8s ease-out 0.2s both;
        }

        .forecast-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border-top: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .forecast-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
        }

        .coin-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-weight: 500;
        }

        .stat-value {
            color: #333;
            font-weight: 700;
            font-size: 1.1em;
        }

        .risk-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .risk-low {
            background: #d4edda;
            color: #155724;
        }

        .risk-medium {
            background: #fff3cd;
            color: #856404;
        }

        .risk-high {
            background: #f8d7da;
            color: #721c24;
        }

        .risk-very-high {
            background: #721c24;
            color: white;
        }

        .trend-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .trend-increasing {
            background: #ffebee;
            color: #c62828;
        }

        .trend-stable {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .trend-decreasing {
            background: #e3f2fd;
            color: #1565c0;
        }

        .portfolio-risk {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            animation: fadeUp 1s ease-out 0.3s both;
        }

        .portfolio-risk h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .portfolio-stat {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .portfolio-stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .portfolio-stat-value {
            font-size: 2em;
            font-weight: 700;
        }

        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            animation: fadeUp 1.2s ease-out 0.4s both;
        }

        .chart-container h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.3em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: slideDown 0.3s ease-out;
        }

        .message.error {
            background: #fee;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .message.success {
            background: #efe;
            color: #3c3;
            border-left: 4px solid #3c3;
        }

        .message.info {
            background: #eef;
            color: #33c;
            border-left: 4px solid #33c;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 60px;
            padding: 20px;
            opacity: 0.8;
            font-size: 0.9em;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .select-coin-hint {
            color: #666;
            font-size: 0.9em;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .control-grid {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
            }

            .button-group {
                flex-direction: column;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 Crypto Volatility Forecaster</h1>
            <p>Multi-coin analysis with AI-powered predictions</p>
        </header>

        <div id="message-container"></div>

        <div class="control-panel">
            <div class="control-grid">
                <div class="control-group">
                    <label>📊 Select Cryptocurrencies</label>
                    <div class="coin-selector" id="coin-selector">
                        <!-- Populated by JS -->
                    </div>
                    <div class="select-coin-hint">Select 1-5 coins to compare</div>
                </div>

                <div class="control-group">
                    <label>⏰ Prediction Horizon</label>
                    <div class="horizon-group" id="horizon-selector">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="generateForecast()" id="forecast-btn">
                    🚀 Generate Forecast
                </button>
                <button class="btn-secondary" onclick="downloadReport()" id="download-btn" style="display:none;">
                    📥 Download Report
                </button>
                <button class="btn-secondary" onclick="location.href='/about'">
                    📖 How It Works
                </button>
            </div>
        </div>

        <div id="results-container"></div>

        <footer>
            <p>
                Built with Python • Flask • Machine Learning<br>
                <a href="https://github.com/yourname/crypto-volatility" style="color: white;">GitHub</a> | 
                <a href="https://linkedin.com/in/yourprofile" style="color: white;">LinkedIn</a>
            </p>
        </footer>
    </div>

    <script>
        let lastForecast = null;
        let volatilityChart = null;

        // Data passed from template
        const CRYPTOS = {{ cryptos | tojson }};
        const HORIZONS = {{ horizons | tojson }};

        function initializeUI() {
            // Initialize coin selector
            const coinSelector = document.getElementById('coin-selector');
            let html = '';
            for (const [symbol, name] of Object.entries(CRYPTOS)) {
                const checked = ['BTC', 'ETH'].includes(symbol) ? 'checked' : '';
                html += `
                    <label class="coin-checkbox">
                        <input type="checkbox" value="${symbol}" ${checked} onchange="updateSelection()">
                        <span>${symbol}</span>
                    </label>
                `;
            }
            coinSelector.innerHTML = html;

            // Initialize horizon selector
            const horizonSelector = document.getElementById('horizon-selector');
            html = '';
            let first = true;
            for (const [days, label] of Object.entries(HORIZONS)) {
                const active = first ? 'active' : '';
                html += `
                    <button class="horizon-btn ${active}" onclick="selectHorizon(${days})" data-days="${days}">
                        ${label}
                    </button>
                `;
                first = false;
            }
            horizonSelector.innerHTML = html;
        }

        function selectHorizon(days) {
            document.querySelectorAll('.horizon-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.days == days);
            });
        }

        function getSelectedHorizon() {
            const active = document.querySelector('.horizon-btn.active');
            return active ? parseInt(active.dataset.days) : 15;
        }

        function getSelectedCoins() {
            const checkboxes = document.querySelectorAll('.coin-checkbox input:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        function updateSelection() {
            const coins = getSelectedCoins();
            if (coins.length > 5) {
                showMessage('warning', 'Maximum 5 coins allowed. Deselecting last coin.');
                const checkboxes = document.querySelectorAll('.coin-checkbox input:checked');
                checkboxes[checkboxes.length - 1].checked = false;
            }
        }

        async function generateForecast() {
            const coins = getSelectedCoins();
            const horizon = getSelectedHorizon();

            if (coins.length === 0) {
                showMessage('error', 'Please select at least one cryptocurrency');
                return;
            }

            const btn = document.getElementById('forecast-btn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="width: 20px; height: 20px; display: inline-block; margin-right: 10px; border-width: 2px;"></div> Analyzing...';

            try {
                const response = await fetch('/api/forecast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ coins, horizon })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    lastForecast = data;
                    displayResults(data);
                    showMessage('success', '✅ Forecast generated successfully!');
                    document.getElementById('download-btn').style.display = 'inline-block';
                } else {
                    showMessage('error', 'Error: ' + data.message);
                }
            } catch (error) {
                showMessage('error', 'Failed to generate forecast: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🚀 Generate Forecast';
            }
        }

        function displayResults(data) {
            const container = document.getElementById('results-container');
            let html = '';

            // Portfolio risk section
            const pr = data.portfolio_risk;
            const riskColor = pr.portfolio_risk === 'HIGH' ? '#f8d7da' : (pr.portfolio_risk === 'MEDIUM' ? '#fff3cd' : '#d4edda');
            const riskTextColor = pr.portfolio_risk === 'HIGH' ? '#721c24' : (pr.portfolio_risk === 'MEDIUM' ? '#856404' : '#155724');

            html += `
                <div class="portfolio-risk">
                    <h2>📈 Portfolio Risk Analysis</h2>
                    <div class="portfolio-grid">
                        <div class="portfolio-stat" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                            <div class="portfolio-stat-label">Average Volatility</div>
                            <div class="portfolio-stat-value">${pr.average_volatility}%</div>
                        </div>
                        <div class="portfolio-stat" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                            <div class="portfolio-stat-label">Max Volatility</div>
                            <div class="portfolio-stat-value">${pr.max_volatility}%</div>
                        </div>
                        <div class="portfolio-stat" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                            <div class="portfolio-stat-label">Min Volatility</div>
                            <div class="portfolio-stat-value">${pr.min_volatility}%</div>
                        </div>
                        <div class="portfolio-stat" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white;">
                            <div class="portfolio-stat-label">Portfolio Risk</div>
                            <div class="portfolio-stat-value" style="color: white;">${pr.portfolio_risk}</div>
                        </div>
                    </div>
                    ${pr.high_risk_coins.length > 0 ? `
                        <p style="color: #666; margin-top: 15px;">
                            <strong>⚠️ High Risk Coins:</strong> ${pr.high_risk_coins.join(', ')}
                        </p>
                    ` : ''}
                </div>
            `;

            // Individual coin forecasts
            html += '<div class="results-grid">';
            for (const [coin, forecast] of Object.entries(data.forecasts)) {
                if (!forecast.success) continue;

                const riskClass = `risk-${forecast.risk_level}`;
                const trendClass = `trend-${forecast.trend}`;

                html += `
                    <div class="forecast-card">
                        <div class="coin-name">${coin}</div>
                        <div class="stat">
                            <span class="stat-label">Current Volatility:</span>
                            <span class="stat-value">${forecast.current_vol}%</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">${data.horizon_days}-Day Forecast:</span>
                            <span class="stat-value">${forecast.forecast_vol}%</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Latest Price:</span>
                            <span class="stat-value">\$${forecast.latest_price.toLocaleString()}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Trend:</span>
                            <span class="trend-badge ${trendClass}">${forecast.trend.toUpperCase()}</span>
                        </div>
                        <div>
                            <span class="stat-label">Risk Level:</span><br>
                            <span class="risk-badge ${riskClass}">${forecast.risk_level}</span>
                        </div>
                    </div>
                `;
            }
            html += '</div>';

            // Chart section
            if (Object.keys(data.forecasts).length > 0) {
                const firstCoin = Object.keys(data.forecasts)[0];
                html += `
                    <div class="chart-container">
                        <h3>📊 Price & Volatility History - ${firstCoin}</h3>
                        <div style="position: relative; height: 400px;">
                            <canvas id="volatilityChart"></canvas>
                        </div>
                        <p style="color: #666; margin-top: 15px; font-size: 0.9em;">
                            Select different coins to view their historical volatility
                        </p>
                    </div>
                `;
            }

            container.innerHTML = html;
            if (Object.keys(data.forecasts).length > 0) {
                loadChart(Object.keys(data.forecasts)[0]);
            }
        }

        async function loadChart(coin) {
            try {
                const response = await fetch('/api/chart-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ coin, days: 100 })
                });

                const data = await response.json();

                if (data.error) {
                    console.error(data.error);
                    return;
                }

                const ctx = document.getElementById('volatilityChart');
                if (!ctx) return;

                const chartCtx = ctx.getContext('2d');

                if (volatilityChart) {
                    volatilityChart.destroy();
                }

                volatilityChart = new Chart(chartCtx, {
                    type: 'line',
                    data: {
                        labels: data.dates,
                        datasets: [
                            {
                                label: `${coin} Price ($)`,
                                data: data.prices,
                                borderColor: '#667eea',
                                backgroundColor: 'rgba(102, 126, 234, 0.05)',
                                borderWidth: 2,
                                tension: 0.4,
                                yAxisID: 'y',
                                fill: true,
                            },
                            {
                                label: 'Annualized Volatility (%)',
                                data: data.volatility,
                                borderColor: '#f5576c',
                                backgroundColor: 'rgba(245, 87, 108, 0.05)',
                                borderWidth: 2,
                                tension: 0.4,
                                yAxisID: 'y1',
                                fill: false,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: {
                                display: true,
                                labels: { font: { size: 12 }, padding: 15 }
                            }
                        },
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: { display: true, text: 'Price ($)' }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: { display: true, text: 'Volatility (%)' },
                                grid: { drawOnChartArea: false }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Chart load error:', error);
            }
        }

        async function downloadReport() {
            if (!lastForecast) return;

            const coins = getSelectedCoins();
            const horizon = getSelectedHorizon();

            try {
                const response = await fetch('/api/download-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ coins, horizon })
                });

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `crypto_forecast_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);

                showMessage('success', '✅ Report downloaded!');
            } catch (error) {
                showMessage('error', 'Failed to download report: ' + error.message);
            }
        }

        function showMessage(type, text) {
            const container = document.getElementById('message-container');
            const className = type === 'error' ? 'error' : (type === 'success' ? 'success' : 'info');
            container.innerHTML = `<div class="message ${className}">${text}</div>`;
            setTimeout(() => { container.innerHTML = ''; }, 5000);
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initializeUI);
    </script>
</body>
</html>
